<title>Trace Canvas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a transit map of your work. Threads are lines, records are stations, forks and merges are interchanges.
   Full-height app: header with view tabs, a drawing surface, a detail drawer, and a capture bar docked at the bottom. */
:root {
  --bg: #ECEEEA;
  --surface: #FFFFFF;
  --surface-2: #F5F6F3;
  --ink: #15181C;
  --muted: #59616B;
  --faint: #8A919A;
  --rule: #D3D7D1;
  --rule-soft: #E3E6E1;
  --grid: #C9CEC6;
  --accent: #1D4ED8;
  --accent-soft: #DCE5FB;
  --accent-ink: #FFFFFF;
  --inbox: #7A828C;
  --edge: #66707B;
  --danger: #C2302A;
  --ok: #1D7F4E;
  --warn: #D9480F;
  --scrim: rgba(12, 14, 18, .38);
  --shadow: 0 1px 2px rgba(20, 24, 28, .06), 0 8px 24px rgba(20, 24, 28, .10);
  --f-display: "Barlow Condensed", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --f-body: "Barlow", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #101317; --surface: #191D23; --surface-2: #14181D; --ink: #E6E9ED; --muted: #9AA3AD; --faint: #6D7681;
    --rule: #2B3139; --rule-soft: #22272E; --grid: #2A3038; --accent: #7397FF; --accent-soft: #1E2A48; --accent-ink: #0B1020;
    --inbox: #8D96A1; --edge: #8C95A0; --danger: #FF6F63; --ok: #4CC38A; --warn: #FF8A3D; --scrim: rgba(0, 0, 0, .55);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101317; --surface: #191D23; --surface-2: #14181D; --ink: #E6E9ED; --muted: #9AA3AD; --faint: #6D7681;
  --rule: #2B3139; --rule-soft: #22272E; --grid: #2A3038; --accent: #7397FF; --accent-soft: #1E2A48; --accent-ink: #0B1020;
  --inbox: #8D96A1; --edge: #8C95A0; --danger: #FF6F63; --ok: #4CC38A; --warn: #FF8A3D; --scrim: rgba(0, 0, 0, .55);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
/* Mist, a fresh light palette (More → Theme). Line colours are the lines' own, so it softens them where they are drawn. */
#cv-world, #git-body, #git-legend, #tl-inner { filter: var(--line-filter, none); }
:root[data-theme="mist"] {
  --line-filter: saturate(.55) brightness(1.04);
  --bg: #ECF1F6; --surface: #FCFDFE; --surface-2: #F3F6FA; --ink: #1D2633; --muted: #5A6878; --faint: #93A0AF;
  --rule: #D5DDE7; --rule-soft: #E4EAF1; --grid: #CCD6E2; --accent: #4677AE; --accent-soft: #DAE6F3; --accent-ink: #FFFFFF;
  --inbox: #8794A3; --edge: #748294; --danger: #C24A4A; --ok: #2F8A5E; --warn: #D2691E;
  --shadow: 0 1px 2px rgba(30, 45, 70, .05), 0 8px 24px rgba(30, 45, 70, .08);
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

#app { height: 100%; display: flex; flex-direction: column; }

/* ---------- header ---------- */
.top {
  display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--rule);
  position: relative; z-index: 40;
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .01em; line-height: 1; }
.brand-sub { font-size: 13px; color: var(--muted); font-weight: 500; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.sync[data-mode="db"]::before, .sync[data-mode="server"]::before { background: var(--ok); }
.sync[data-mode="offline"]::before { background: var(--danger); }
.brand-sub:empty { display: none; }
.lang-btn { min-width: 44px; justify-content: center; }
.sync[data-mode="local"]::before { background: #E0A100; }
.sync[data-mode="ro"]::before { background: var(--inbox); }
.tabs { display: flex; gap: 2px; padding: 2px; background: var(--surface-2); border: 1px solid var(--rule); border-radius: var(--r); }
.tab {
  font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .03em;
  padding: 4px 12px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--surface); }
.tab-goals, .gl-acts .gl-view, .gl-acts .gl-edit { display: none; } /* phone only (narrow screens below) */
.gl-acts { display: contents; }
.spacer { flex: 1 1 0; }
.search { flex: 0 1 220px; min-width: 120px; position: relative; }
.search input {
  width: 100%; padding: 6px 10px 6px 28px; border: 1px solid var(--rule); border-radius: var(--r);
  background: var(--surface-2);
}
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; font-size: 13px; font-weight: 500;
  border: 1px solid var(--rule); border-radius: 7px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--faint); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn-primary:hover { border-color: var(--ink); opacity: .9; }
.btn-accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn-quiet:hover { color: var(--ink); border-color: var(--rule); }
.btn-quiet-danger { border-color: transparent; background: transparent; color: var(--danger); }
.icon-btn { width: 30px; height: 30px; display: inline-grid; place-items: center; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
.icon-btn:hover { border-color: var(--rule); color: var(--ink); }

.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); min-width: 210px; padding: 6px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); z-index: 60;
}
.menu button { display: flex; width: 100%; justify-content: space-between; gap: 12px; text-align: left; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-size: 13px; }
.menu button:hover { background: var(--surface-2); }
.menu hr { border: 0; border-top: 1px solid var(--rule-soft); margin: 4px 0; }
.menu .k { color: var(--faint); font-family: var(--f-mono); font-size: 11px; }

/* ---------- main ---------- */
main { flex: 1 1 auto; position: relative; min-height: 0; }
.view { position: absolute; inset: 0; }
.banner {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 25;
  display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 12px; max-width: calc(100% - 32px);
  background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; box-shadow: var(--shadow); font-size: 12.5px; color: var(--muted);
}
.banner b { color: var(--ink); font-weight: 600; }
.multi-banner { flex-wrap: wrap; justify-content: center; border-radius: 14px; padding: 8px 10px; gap: 8px; width: max-content; }
.multi-banner select, .multi-banner input { padding: 4px 8px; border: 1px solid var(--rule); border-radius: 7px; background: var(--surface-2); font-size: 12.5px; max-width: 180px; }
.multi-banner .btn { border-radius: 7px; }
.card.is-multi { outline: 2px dashed var(--accent); outline-offset: 2px; }
.card.is-multi-target { outline-style: solid; }
.mb-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.mb-chip { display: inline-flex; align-items: center; border: 1.5px dashed var(--c); border-radius: 999px; background: var(--surface); }
.mb-chip.is-target { border-style: solid; background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.mb-chip button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 3px 4px 3px 9px; color: var(--ink); font: inherit; cursor: pointer; }
.mb-chip button > span { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.mb-chip em { font-style: normal; font-size: 11px; color: var(--muted); }
.mb-chip .mb-x { padding: 3px 9px 3px 4px; color: var(--muted); }
.mb-flow { flex-basis: 100%; text-align: center; color: var(--muted); }
#cv-groups { position: absolute; left: 0; top: 0; }
.grp { position: absolute; border: 1.5px dashed color-mix(in srgb, var(--c) 55%, transparent); border-radius: 14px; background: color-mix(in srgb, var(--c) 7%, transparent); }
.grp-label { position: absolute; padding: 2px 10px; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: var(--ink); font: 600 12.5px var(--f-display); letter-spacing: .03em; cursor: grab; white-space: nowrap; }
.grp-label:hover { background: color-mix(in srgb, var(--c) 30%, var(--surface)); }
.grp-folded { cursor: pointer; border: 1.5px dashed color-mix(in srgb, var(--c) 55%, transparent); padding: 5px 12px; color: var(--muted); }
.phone-qr { display: grid; place-items: center; padding: 8px 0; }
.phone-qr svg { max-width: 100%; height: auto; border-radius: 8px; }
.toast .toast-act { margin-left: 10px; padding: 0; border: 0; background: none; color: var(--accent-soft); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
.card.is-multi .roundel { box-shadow: 0 0 0 3px var(--accent-soft); }
.ex-chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 3px 2px 9px; border: 1px dashed var(--faint); border-radius: 999px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.ex-chip button { border: 0; border-radius: 999px; padding: 2px 8px; background: var(--surface-2); color: var(--ink); font-size: 12px; cursor: pointer; }
.ex-chip button:hover { background: var(--rule-soft); }
.banner .btn { padding: 3px 10px; font-size: 12px; border-radius: 999px; }

.empty { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 5; padding: 16px; }
.empty-card {
  pointer-events: auto; max-width: 420px; padding: 22px 22px 18px; background: var(--surface); border: 1px solid var(--rule);
  border-radius: 12px; box-shadow: var(--shadow);
}
.empty-card h2 { margin: 0 0 6px; font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .01em; text-wrap: balance; }
.empty-card p { margin: 0 0 12px; color: var(--muted); }
.empty-card ul { margin: 0 0 14px; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; }
.empty-card code { font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; color: var(--ink); }

/* ---------- canvas ---------- */
.cv-viewport {
  position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-image: radial-gradient(circle, var(--grid) 1px, transparent 1.4px);
  background-size: 24px 24px;
}
.cv-viewport.panning { cursor: grabbing; }
.cv-viewport.connecting, .cv-viewport.connecting .card { cursor: crosshair; }
.cv-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.cv-edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.cv-edges .e-line { fill: none; stroke-width: 2.4; stroke-linecap: round; }
.cv-edges .edge-fork .e-line { stroke-dasharray: 6 6; }
.cv-edges .edge-rel .e-line { stroke: var(--edge); }
.cv-edges .e-head { stroke: none; }
.cv-edges .edge-rel .e-head { fill: var(--edge); }
.cv-edges .e-label rect { fill: var(--surface); stroke: var(--rule); }
.cv-edges .e-label text { fill: var(--muted); font-size: 12px; font-family: var(--f-body); text-anchor: middle; dominant-baseline: central; }
.cv-edges .edge-rel { pointer-events: auto; cursor: pointer; }
.cv-edges .edge-rel.is-sel .e-label rect { stroke: var(--accent); stroke-width: 2; }
.cv-edges .edge-rel.is-sel .e-line { stroke: var(--accent); }
.cv-edges .edge-rel.is-sel .e-head { fill: var(--accent); }

.card {
  position: absolute; width: 252px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: 0 1px 2px rgba(20, 24, 28, .05); cursor: grab; user-select: none; -webkit-user-select: none;
  transition: box-shadow .15s, opacity .15s;
}
.card:hover { box-shadow: var(--shadow); }
.card.is-sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.card.is-from { outline: 2px dashed var(--accent); outline-offset: 3px; }
.card.is-dim { opacity: .35; }
.card.is-inbox { border-style: dashed; background: var(--surface-2); }
.card.st-done, .card.st-merged { opacity: .72; }
.card.dragging { box-shadow: var(--shadow); cursor: grabbing; z-index: 3; }
.card-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
.roundel { flex: none; width: 15px; height: 15px; border-radius: 50%; border: 4px solid var(--c); background: var(--surface); }
.card-name { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: .01em; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { flex: none; font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
.chip-active { border-color: var(--accent); color: var(--accent); }
.chip-parked { border-style: dashed; }
.chip-done { background: var(--surface-2); }
.chip-merged { background: var(--surface-2); }
.strip { list-style: none; margin: 0; padding: 2px 10px 4px 4px; position: relative; }
.strip::before { content: ""; position: absolute; left: 14.5px; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--c); }
.is-inbox .strip::before { background: repeating-linear-gradient(to bottom, var(--c) 0 4px, transparent 4px 8px); }
.strip li { position: relative; display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 6px; padding: 3px 0; border-radius: 6px; cursor: pointer; }
.strip li:hover .s-title { color: var(--ink); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 2px; }
.strip li.is-sel .s-title { color: var(--accent); font-weight: 600; }
.strip li.hit .s-title { background: var(--accent-soft); border-radius: 3px; }
.strip .g { justify-self: center; }
.s-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 13px; }
.s-time { font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); }
.strip .s-more { color: var(--faint); font-size: 12px; cursor: default; }
.strip .s-empty { color: var(--faint); font-size: 12.5px; cursor: default; }
.card-foot { display: flex; justify-content: space-between; gap: 8px; padding: 6px 12px 9px; border-top: 1px solid var(--rule-soft); font-size: 11.5px; color: var(--faint); }

.hud {
  position: absolute; z-index: 20; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; right: 12px; pointer-events: none;
}
.hud > * { pointer-events: auto; }
.hud-group { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 1px 2px rgba(20, 24, 28, .06); }
.hud-group .btn { border: 0; border-radius: 0; background: transparent; padding: 6px 10px; }
.hud-group .btn + .btn { border-left: 1px solid var(--rule-soft); }
.hud-group .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.hud-zoom { min-width: 48px; justify-content: center; font-family: var(--f-mono); font-size: 12px; }

/* ---------- glyphs ---------- */
.gl-open { fill: var(--surface); stroke-width: 2.4; }
.gl-solid { stroke: var(--surface); stroke-width: 1.6; }
.gl-ring { fill: var(--surface); stroke: var(--ink); stroke-width: 2.6; }
.gl-hole { fill: var(--surface); }
.gl-dim { opacity: .25; }

/* ---------- git graph ---------- */
.git-scroll { position: absolute; inset: 0; overflow: auto; }
.git-legend {
  position: sticky; top: 0; z-index: 3; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg); border-bottom: 1px solid var(--rule-soft);
}
.legend-label { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-right: 4px; }
.lane-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 6px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); font-size: 12.5px; cursor: pointer; }
.lane-chip i { width: 10px; height: 10px; border-radius: 50%; border: 3px solid var(--c); background: var(--surface); }
.lane-chip.is-sel { border-color: var(--accent); }
.git-body { position: relative; padding-left: max(4px, env(safe-area-inset-left, 0px)); }
.git-svg { position: absolute; top: 0; overflow: visible; }
.git-svg .lane { stroke-width: 3; stroke-linecap: round; fill: none; }
.git-svg .lane-open { stroke-width: 3; stroke-dasharray: 2 5; stroke-linecap: round; fill: none; }
.git-svg .link { stroke-width: 3; fill: none; stroke-linecap: round; }
.git-svg [data-cid] { cursor: pointer; }
.g-row {
  /* border-box: the row is exactly ROW tall with its border, so each title stays level with its station */
  display: flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; border-bottom: 1px solid var(--rule-soft);
  padding-right: max(16px, env(safe-area-inset-right, 0px)); cursor: pointer; min-width: 0;
}
.g-row:hover { background: var(--surface-2); }
.g-row.is-sel { background: var(--accent-soft); }
.g-row.is-dim { opacity: .35; }
.g-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-row.k-fork .g-title, .g-row.k-merge .g-title { color: var(--muted); font-style: italic; }
.g-row.done .g-title { text-decoration: line-through; text-decoration-color: var(--faint); color: var(--muted); }
.pill { flex: none; display: inline-flex; align-items: center; gap: 5px; max-width: 160px; font-size: 12px; color: var(--muted); }
.pill i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind-tag { flex: none; font-size: 11px; color: var(--faint); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; }
.agent-tag { flex: none; font-size: 11px; color: var(--muted); background: var(--surface-2); border-radius: 4px; padding: 1px 6px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-time { flex: none; font-family: var(--f-mono); font-size: 11.5px; color: var(--faint); min-width: 78px; text-align: right; }
.g-ago { display: none; } /* phone only */
/* who wrote it: you (solid, dark) or an agent (outlined, in the line's colour) */
.actor { flex: none; width: 18px; height: 18px; display: inline-grid; place-items: center; border-radius: 50%; }
.actor svg { width: 12px; height: 12px; }
.actor.a-human { background: var(--ink); color: var(--surface); }
.actor.a-agent { border: 1.5px solid var(--c, var(--faint)); color: var(--c, var(--faint)); }
.legend-actors { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; color: var(--muted); }
/* live tips: a session working on a line right now, above that line's newest record */
.g-row.g-live { background: color-mix(in srgb, var(--ok) 7%, var(--surface)); }
.g-row.g-live.st-waiting { background: color-mix(in srgb, var(--warn) 9%, var(--surface)); }
.g-row.g-live.st-idle { background: var(--surface-2); }
.g-row.g-live .act { flex: 0 1 auto; min-width: 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34%; }
.git-svg .tip { stroke: var(--surface); stroke-width: 2.5; }
.git-svg .tip.st-working { fill: var(--ok); animation: lpulse 1.6s ease-in-out infinite; }
.git-svg .tip.st-waiting { fill: var(--warn); }
.git-svg .tip.st-idle { fill: var(--faint); }
.git-svg .lane-live { stroke-width: 2; stroke-dasharray: 3 4; fill: none; }
.git-svg [data-sid] { cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .git-svg .tip.st-working { animation: none; } }

/* ---------- timeline ---------- */
.tl-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
.tl-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule-soft);
}
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 4px 12px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--rule-soft); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tl-hint { font-size: 12px; color: var(--faint); }
.tl-scroll { flex: 1 1 auto; overflow: auto; position: relative; }
.tl-inner { position: relative; }
.tl-axis-row { display: flex; position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--rule); }
.tl-corner { flex: none; position: sticky; left: 0; z-index: 4; background: var(--surface); border-right: 1px solid var(--rule); display: flex; align-items: flex-end; padding: 0 0 8px 14px; font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.tl-axis text { font-size: 11px; fill: var(--muted); font-family: var(--f-mono); }
.tl-axis .day text, .tl-axis text.day { fill: var(--ink); font-family: var(--f-body); font-weight: 600; font-size: 12px; }
.tl-axis line { stroke: var(--rule); }
.tl-axis .now-label { fill: var(--accent); font-family: var(--f-body); font-weight: 600; }
.tl-body-row { display: flex; }
.tl-labels { flex: none; position: sticky; left: 0; z-index: 2; background: var(--bg); border-right: 1px solid var(--rule); }
.tl-label { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--rule-soft); cursor: pointer; min-width: 0; }
.tl-label:hover { background: var(--surface-2); }
.tl-label.is-sel { background: var(--accent-soft); }
.tl-label .roundel { width: 13px; height: 13px; border-width: 3.5px; }
.tl-label .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.tl-label .ct { font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
.tl-body .grid-l { stroke: var(--rule-soft); }
.tl-body .grid-day { stroke: var(--rule); }
.tl-body .row-sep { stroke: var(--rule-soft); }
.tl-body .bar { stroke-width: 6; stroke-linecap: round; opacity: .32; fill: none; }
.tl-body .bar.parked { stroke-dasharray: 1 9; opacity: .6; }
.tl-body .base { stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 3 4; }
.tl-body .link { fill: none; stroke-width: 2; stroke-dasharray: 4 4; }
.tl-body .now { stroke: var(--accent); stroke-width: 1.5; }
.tl-body .tip { font-size: 11.5px; fill: var(--muted); font-family: var(--f-body); dominant-baseline: central; }
.tl-body [data-cid] { cursor: pointer; }
.tl-body .is-sel circle, .tl-body .is-sel rect, .tl-body .is-sel polygon { stroke: var(--accent) !important; stroke-width: 3; }

/* ---------- detail drawer ---------- */
.detail {
  position: absolute; z-index: 30; top: 12px; bottom: 12px; right: max(12px, env(safe-area-inset-right, 0px)); width: 372px;
  display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
}
.d-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 14px; border-bottom: 1px solid var(--rule-soft); }
.d-eyebrow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.d-eyebrow .mono { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 11.5px; color: var(--faint); }
.d-scroll { flex: 1 1 auto; overflow: auto; padding: 12px 14px 16px; display: grid; gap: 12px; align-content: start; }
.fld { display: grid; gap: 4px; min-width: 0; }
.fld > span { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.fld input, .fld select, .fld textarea {
  width: 100%; min-width: 0; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 7px; background: var(--surface-2);
}
.fld textarea { resize: vertical; line-height: 1.5; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big-input { font-family: var(--f-display); font-weight: 600; font-size: 19px !important; letter-spacing: .01em; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 5px solid var(--c); background: var(--surface); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.d-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--rule-soft); padding-top: 12px; }
.inline-form { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
.inline-form input, .inline-form select { flex: 1 1 140px; min-width: 0; padding: 6px 9px; border: 1px solid var(--rule); border-radius: 7px; background: var(--surface-2); }
.confirm { font-size: 13px; color: var(--danger); }
.meta { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.meta a, .linkish { color: var(--accent); cursor: pointer; text-decoration: none; background: none; border: 0; padding: 0; font: inherit; }
.meta a:hover, .linkish:hover { text-decoration: underline; }
.links { display: grid; gap: 4px; }
.links a, .links code { font-size: 12.5px; overflow-wrap: anywhere; }
.links a { color: var(--accent); }
.links code { font-family: var(--f-mono); background: var(--surface-2); padding: 2px 6px; border-radius: 4px; }
.d-strip { list-style: none; margin: 0; padding: 0 0 0 2px; position: relative; display: grid; }
.d-strip::before { content: ""; position: absolute; left: 12.5px; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--c); }
.d-strip li { position: relative; display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; cursor: pointer; }
.d-strip li:hover .s-title { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.d-strip .g { justify-self: center; }
.sec-label { font-family: var(--f-display); font-weight: 600; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.label-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.label-chips button { font-size: 12px; padding: 3px 9px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); cursor: pointer; }
.label-chips button:hover { border-color: var(--faint); }

/* ---------- capture bar ---------- */
.capture {
  display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: flex-end;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-top: 1px solid var(--rule); position: relative; z-index: 35;
}
.cap-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.cap-thread { position: relative; display: inline-flex; align-items: center; }
.cap-thread i { position: absolute; left: 10px; width: 11px; height: 11px; border-radius: 50%; border: 3px solid var(--c); background: var(--surface); pointer-events: none; }
.cap-thread select { appearance: none; -webkit-appearance: none; padding: 7px 26px 7px 28px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface-2); max-width: 190px; font-weight: 500; cursor: pointer; }
.cap-thread::after { content: ""; position: absolute; right: 10px; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-2px) rotate(45deg); pointer-events: none; }
.kinds { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface-2); }
.kinds button { display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.kinds button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--rule); }
.cap-input { flex: 1 1 320px; display: flex; gap: 8px; align-items: flex-end; min-width: 0; }
.cap-input textarea {
  flex: 1; min-width: 0; resize: none; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 9px; background: var(--surface-2);
  line-height: 1.45; max-height: 150px; overflow-y: auto;
}
.cap-input textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.cap-input .btn { padding: 8px 14px; }

/* ---------- sheets ---------- */
/* While a sheet is open the header stays above its scrim, so More and the other header buttons still work. */
body.sheet-open .top { z-index: 80; }
.scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.sheet { width: min(660px, 100%); max-height: min(86vh, 100%); display: flex; flex-direction: column; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px 18px; border-bottom: 1px solid var(--rule-soft); }
.sheet-head h3 { flex: 1; margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .01em; }
.sheet-body { padding: 14px 18px 18px; overflow: auto; display: grid; gap: 14px; align-content: start; }
.sheet-body p { margin: 0; color: var(--muted); max-width: 65ch; }
.sheet-body h4 { margin: 4px 0 0; font-size: 14px; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--rule-soft); }
.codebox { position: relative; }
.codebox pre { margin: 0; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--rule-soft); border-radius: 8px; font-family: var(--f-mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
.codebox .btn { position: absolute; right: 8px; top: 8px; padding: 3px 9px; font-size: 12px; }
.sheet textarea.import { width: 100%; min-height: 140px; padding: 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface-2); font-family: var(--f-mono); font-size: 12px; resize: vertical; }
.ai-summary { padding: 12px 14px; background: var(--surface-2); border-radius: 8px; color: var(--ink) !important; }
.ai-list { display: grid; gap: 6px; }
.ai-item { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; padding: 8px 10px; border: 1px solid var(--rule-soft); border-radius: 8px; cursor: pointer; }
.ai-item input { margin-top: 3px; }
.ai-item .why { display: block; font-size: 12px; color: var(--faint); margin-top: 2px; }
.ai-thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }

.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 90; max-width: calc(100% - 32px);
  padding: 8px 14px; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 13px; box-shadow: var(--shadow);
}
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 4px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

@media (prefers-reduced-motion: reduce) {
  .flash, .pulse { animation: none; }
  .card { transition: none; }
}

/* ---------- narrow screens ---------- */
@media (max-width: 760px) {
  .brand-sub, .sync-text { display: none; }
  .brand-name { font-size: 18px; }
  .search { order: 10; flex: 1 1 100%; }
  .tab { padding: 4px 10px; }
  .g-row .kind-tag, .g-row .agent-tag, .g-row .pill, .g-row .g-time { display: none; }
  .pill { max-width: 96px; }
  .g-time { min-width: 0; }
  /* Branches on a phone: rows are 52px (ROW in renderGit) with a two-line title and a short time. */
  .g-row { height: 52px; gap: 8px; align-items: center; }
  .g-row .g-title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 14px; line-height: 1.3; }
  .g-row.g-live .act { display: none; }
  .g-ago { display: block; flex: none; align-self: flex-start; padding-top: 9px; font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
  .cap-input { flex-basis: 100%; }
  .kinds button span { display: none; }
  .kinds button { padding: 5px 7px; }
  .hud .btn-label { display: none; }
  .toast { bottom: 140px; }
  /* A phone shows the graph, not the chrome: the lines' legend is one row that scrolls sideways,
     and the capture bar is a single line until you tap into it (then the line and kind appear). */
  .git-legend { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .git-legend::-webkit-scrollbar { display: none; }
  .git-legend > * { flex: none; }
  .capture:not(:focus-within) .cap-meta { display: none; }
  .capture:not(:focus-within) .cap-input textarea { height: 38px !important; overflow: hidden; }

  /* ---- A phone shows pages, not layers ----
     Goals is a tab whose page sits under the header; a line, record or session opens as a full page with ←
     (the back gesture closes it too); the other sheets fill the screen. Inputs are 16px so iOS does not zoom. */
  .tab-goals { display: inline-block; }
  #goals-btn { display: none; }
  .tabs { overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; padding: 4px 9px; }
  .search { order: 0; flex: 1 1 110px; }
  input, select, textarea { font-size: 16px; }
  .scrim { padding: 0; }
  .sheet { width: 100%; max-height: none; height: 100%; border-radius: 0; box-shadow: none; }
  body.sheet-open:not(.goals-page) .top { z-index: 40; }
  body.goals-page .scrim { top: var(--top-h, 0px); background: var(--bg); }
  body.goals-page .sheet { background: var(--bg); }
  body.goals-page .sheet-head { display: none; }
  body.goals-page .sheet-body { padding: 12px 12px 32px; gap: 12px; }
  .detail { position: fixed; z-index: 85; inset: 0; width: auto; border: 0; border-radius: 0; box-shadow: none; padding-top: env(safe-area-inset-top, 0px); }
  .d-head [data-act="close"] { order: -1; width: 40px; height: 40px; font-size: 0; }
  .d-head [data-act="close"]::before { content: "←"; font-size: 22px; }
  .d-actions .btn { min-height: 40px; }
  .detail .fld input, .detail .fld select, .detail .fld textarea { box-sizing: border-box; min-width: 0; max-width: 100%; }

}
@media (max-width: 480px) {
  .brand-name { display: none; }
  .top { gap: 8px 10px; }
}

/* ---------- live sessions ---------- */
.live-bar { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; position: relative; z-index: 30;
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface-2); border-bottom: 1px solid var(--rule); }
.live-bar[hidden] { display: none; }
/* Focus mode: which group every view is narrowed to */
.focus-bar { display: flex; align-items: center; gap: 8px; position: relative; z-index: 30; font-size: 13px;
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--accent-soft); border-bottom: 1px solid var(--rule); }
.focus-bar[hidden] { display: none; }
.focus-bar b { flex: none; }
.focus-bar .fb-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.focus-bar .fb-n { color: var(--muted); white-space: nowrap; }
.focus-bar .btn { flex: none; padding: 3px 9px; font-size: 12.5px; }
.focus-list { display: grid; gap: 8px; }
.focus-list .btn { justify-content: space-between; padding: 10px 12px; font-size: 14px; }
.focus-list .btn span { opacity: .7; }
.focus-list .btn[aria-pressed="true"] { border-style: dashed; color: var(--muted); }
.live-bar::-webkit-scrollbar { display: none; }
.live-label { flex: none; font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.live-count { flex: none; font-size: 12px; color: var(--faint); margin-right: 4px; }
.live-chip { flex: none; display: inline-flex; align-items: center; gap: 7px; max-width: 360px; padding: 4px 11px 4px 9px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 12.5px; }
.live-chip:hover { border-color: var(--faint); }
.live-chip.st-waiting { border-color: var(--warn); }
.live-chip.is-sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.live-chip b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
.live-chip .act { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ldot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.st-working .ldot, .ldot.st-working { background: var(--ok); animation: lpulse 1.6s ease-in-out infinite; }
.st-waiting .ldot, .ldot.st-waiting { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 28%, transparent); }
@keyframes lpulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .st-working .ldot, .ldot.st-working { animation: none; } }
.live-badge { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); }
.live-badge.st-working { border-color: var(--ok); color: var(--ok); }
.live-badge.st-waiting { border-color: var(--warn); color: var(--warn); }
.l-title { font-family: var(--f-display); font-weight: 700; font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
.l-status { display: flex; align-items: baseline; gap: 8px; font-weight: 600; flex-wrap: wrap; }
.l-status .ldot { align-self: center; }
.l-status .act { font-weight: 400; color: var(--muted); overflow-wrap: anywhere; }
.l-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rt-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rt-list li { display: grid; gap: 6px; padding: 10px 11px; border: 1px solid var(--rule-soft); border-radius: 10px; }
.rt-bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.rt-bar i { display: block; height: 100%; border-radius: 3px; background: var(--c); filter: var(--line-filter, none); }
.rt-stats { font-size: 12px; color: var(--muted); }
.rt-why { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
.rt-why dt { color: var(--faint); }
.rt-why dd { margin: 0; }
.rt-act { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rt-layer { padding: 5px 8px; border: 1px solid var(--rule); border-radius: 7px; background: var(--surface-2); color: var(--ink); font: inherit; font-size: 12.5px; max-width: 100%; }
.rt-done { font-size: 12.5px; color: var(--accent); }
.l-list li { display: grid; grid-template-columns: 10px 1fr; gap: 1px 8px; align-items: center; padding: 6px 9px; border: 1px solid var(--rule-soft); border-radius: 8px; cursor: pointer; }
.l-list li:hover { border-color: var(--faint); }
.l-list li.st-waiting { border-color: var(--warn); }
.l-list.s-list li { grid-template-columns: 10px 1fr auto; cursor: default; }
.l-list.s-list li.is-live { cursor: pointer; }
.l-list.s-list .s-name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.l-list.s-list .s-acts { grid-column: 3; grid-row: 1 / span 2; display: flex; gap: 6px; }
.l-list.s-list .btn { padding: 3px 9px; font-size: 12px; text-decoration: none; }
.ag-open { margin-left: auto; padding: 0 4px; color: var(--accent); font: inherit; font-weight: 600; text-decoration: none; background: none; border: 0; cursor: pointer; }
.ag-open:hover { text-decoration: underline; }
.l-list li.st-off .ldot { opacity: .35; }
.l-list .act { grid-column: 2; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l-cmd { display: flex; gap: 6px; align-items: center; }
.gx-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.gx-head select { font-size: 12px; max-width: 60%; }

.gx-diff .a { color: var(--ok); } .gx-diff .d { color: var(--danger); } .gx-diff .h { color: var(--faint); }
.gx-note { margin: 0; color: var(--faint); font-size: 12px; }

/* ---------- agents view ---------- */

.ag-session { width: 270px; height: 80px; padding: 9px 12px 8px 14px; background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--c, var(--rule)); border-radius: 10px; box-shadow: 0 1px 2px rgba(20, 24, 28, .05); display: grid; gap: 2px; align-content: start; }

.ag-session.is-sel { outline: 2px solid var(--accent); outline-offset: 1px; }

.ag-session.st-off { background: var(--surface-2); border-style: dashed; cursor: default; }
.ag-session .ag-t { display: flex; align-items: center; gap: 7px; font-weight: 600; min-width: 0; }
.ag-session .ag-t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-session .ag-a, .ag-session .ag-m { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- agents view: who started whom ---- */
const AG = { col: 310, row: 96, pad: 24, sessionH: 80, agentH: 38 };
function agentTree() {
  const all = [...S.liveOthers, ...S.live];
  const byId = new Map(all.map(s => [s.id, s]));
  const kids = new Map(), roots = [];
  for (const s of all) {
    if (s.parent && byId.has(s.parent)) { if (!kids.has(s.parent)) kids.set(s.parent, []); kids.get(s.parent).push(s); }
    else roots.push(s);
  }
  // A tree that holds a session needing you comes first, then by thread (in canvas order).
  const order = new Map(orderedThreads().map((th, i) => [th.id, i]));
  const best = s => [s, ...(kids.get(s.id) || [])].reduce((m, x) => {
    const sub = x === s ? { rank: LIVE_RANK[s.status] ?? 3, ord: order.get(s.threadId) ?? 1e9 } : best(x);
    return { rank: Math.min(m.rank, sub.rank), ord: Math.min(m.ord, sub.ord) };
  }, { rank: 3, ord: 1e9 });
  const key = new Map(roots.map(r => [r.id, best(r)]));
  roots.sort((a, b) => key.get(a.id).rank - key.get(b.id).rank || key.get(a.id).ord - key.get(b.id).ord || a.startedAt - b.startedAt);
  return { byId, kids, roots };
}
// Tidy tree, left to right: every node takes one row slot, a parent sits in the middle of its children.
function layoutAgents() {
  const { kids, roots } = agentTree();
  let slot = 0, maxDepth = 0;
  const nodes = [], links = [];
  const place = (n, kind, depth, color) => {
    maxDepth = Math.max(maxDepth, depth);
    const children = kind === 'session'
      ? [...(kids.get(n.id) || []).sort((a, b) => a.startedAt - b.startedAt).map(c => ({ n: c, kind: 'session' })), ...(n.agents || []).map(a => ({ n: a, kind: 'agent' }))]
      : [];
    const th = kind === 'session' && n.threadId ? S.threads.get(n.threadId) : null;
    const c = th ? th.color : color;
    const placed = children.map(ch => place(ch.n, ch.kind, depth + 1, c));
    const cy = placed.length ? (placed[0].cy + placed[placed.length - 1].cy) / 2 : AG.pad + (slot++) * AG.row + AG.row / 2;
    const node = { n, kind, depth, cy, x: AG.pad + depth * AG.col, color: c };
    nodes.push(node);
    for (const p of placed) links.push({ from: node, to: p });
    return node;
  };
  for (const r of roots) place(r, 'session', 0, null);
  return { nodes, links, w: AG.pad * 2 + maxDepth * AG.col + 280, h: AG.pad * 2 + slot * AG.row };
}

function freeSpot(near) {
  const pts = [...S.threads.values()].map(th => [th.x || 0, th.y || 0]).concat([[S.inboxPos.x, S.inboxPos.y]]);
  const free = (x, y) => pts.every(([px, py]) => Math.abs(px - x) > 220 || Math.abs(py - y) > 170);
  if (near) {
    for (let k = 0; k < 14; k++) {
      const dy = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 190;
      const x = (near.x || 0) + 300, y = (near.y || 0) + dy;
      if (free(x, y)) return { x, y };
    }
  }
  for (let r = 0; r < 60; r++) for (let c = 1; c <= 4; c++) { const x = c * 300, y = r * 250; if (free(x, y)) return { x, y }; }
  return { x: 300, y: pts.length * 250 };
}
function newThread({ name, parent = null, forkOf = null, near = null, group = '' }) {
  const used = new Set([...S.threads.values()].map(th => th.color));
  const color = LINE_COLORS.find(c => !used.has(c)) || LINE_COLORS[S.threads.size % LINE_COLORS.length];
  const pos = freeSpot(near);
  const th = { id: uid('t'), name: name || t('newThreadName', S.threads.size + 1), color, status: 'active', createdAt: Date.now(), parent, forkOf, mergedInto: null, x: pos.x, y: pos.y, note: '', ...(group ? { group } : {}) };
  putDoc('threads', th, 0);
  return th;
}
function ensureThread(name) { return threadByName(name) || newThread({ name: String(name).trim() }).id; }
function addCommit({ thread, kind = 'idea', title, body = '', links = [], agent = '', ts = Date.now(), parents, extra = {} }) {
  const tid = thread && (thread === INBOX || S.threads.has(thread)) ? thread : INBOX;
  const prev = lastCommit(tid);
  const c = { id: uid('c'), thread: tid, kind, title: String(title || '').slice(0, 500), body, links, agent, ts, parents: parents || (prev ? [prev.id] : []), done: false, ...extra };
  putDoc('commits', c, 0);

}
function forkFrom(cid, name) {

  addCommit({ thread: th.id, kind: 'fork', title: t('forkTitle', pt.name, c.title).slice(0, 120), parents: [cid], ts: Math.max(Date.now(), c.ts + 1) });

function deleteThread(id) {

  for (const e of [...S.edges.values()]) if (e.from === id || e.to === id) removeDoc('edges', e.id);

/* ================= import / export ================= */
function parseTs(v) {
  if (typeof v === 'number' && isFinite(v)) return v < 1e12 ? v * 1000 : v;
  if (typeof v === 'string') { const n = Date.parse(v); if (!isNaN(n)) return n; }
  return Date.now();
}
function importText(text) {
  text = String(text || '').trim();
  let data = null;
  try { data = JSON.parse(text); } catch { data = null; }
  if (data && !Array.isArray(data) && typeof data === 'object' && (Array.isArray(data.threads) || Array.isArray(data.commits))) {
    let n = 0;
    for (const col of COLS) for (const d of data[col] || []) if (d && typeof d.id === 'string' && /^[\w\-.~:@+]{1,180}$/.test(d.id)) { putDoc(col, { ...d }, 0); n++; }
    return n;
  }
  let recs = [];
  if (Array.isArray(data)) recs = data;
  else if (data && typeof data === 'object') recs = [data];
  else recs = text.split('\n').map(l => { const s = l.trim().replace(/,$/, ''); if (!s.startsWith('{')) return null; try { return JSON.parse(s); } catch { return null; } }).filter(Boolean);
  let n = 0;
  for (const r of recs) {
    if (!r || typeof r !== 'object') continue;
    const title = String(r.title || r.summary || r.text || '').trim();
    if (!title) continue;
    const tid = r.thread ? ensureThread(String(r.thread)) : S.captureThread;
    addCommit({
      thread: tid, kind: USER_KINDS.includes(r.kind) ? r.kind : 'agent', title,
      body: typeof r.body === 'string' ? r.body : (r.body ? JSON.stringify(r.body) : ''),
      links: Array.isArray(r.links) ? r.links.map(String) : (r.link ? [String(r.link)] : []),
      agent: r.agent ? String(r.agent) : '', ts: parseTs(r.ts),
    });
    n++;
  }
  if (!n) throw new Error('none');
  return n;
}

    case 'decision': return `<g class="${dim}"><circle class="gl-solid" cx="${x}" cy="${y}" r="${r * 1.12}" style="fill:${color}"/><circle class="gl-hole" cx="${x}" cy="${y}" r="${r * 0.42}"/></g>`;

/* ================= timeline ================= */
const TLZ = { day: 56, week: 9, month: 2.4 };
function renderTimeline() {
  const wrap = $('#tl-scroll'), inner = $('#tl-inner');
  $$('#tl-zoom button').forEach(b => b.setAttribute('aria-pressed', b.dataset.z === S.tlZoom ? 'true' : 'false'));
  const by = byThread();
  const ids = viewLines().map(th => th.id).filter(id => by.has(id));
  if (!ids.length) { inner.innerHTML = ''; return; }
  const H = 3600e3, pph = TLZ[S.tlZoom] || 9, now = Date.now();
  let min = Infinity, max = -Infinity;
  for (const id of ids) for (const c of by.get(id)) { min = Math.min(min, c.ts); max = Math.max(max, c.ts); }
  const LW = window.innerWidth < 760 ? 118 : 184;
  const viewW = Math.max(240, wrap.clientWidth - LW);
  let t0 = min - (70 / pph) * H;
  const t1 = Math.max(max, now) + (290 / pph) * H;
  if ((t1 - t0) / H * pph < viewW) t0 = t1 - (viewW / pph) * H;
  const W = Math.round((t1 - t0) / H * pph);
  const X = ts => (ts - t0) / H * pph;
  const RH = 52, AH = 46, BH = ids.length * RH;

  const step = [1, 2, 3, 6, 12, 24, 48, 168].find(s => s * pph >= 64) || 168;
  const ticks = [], days = [];

  const m = new Date(t0); m.setHours(24, 0, 0, 0);
  while (m.getTime() <= t1) { days.push(m.getTime()); m.setDate(m.getDate() + 1); }

  let axis = '';

    for (const ts of days) axis += `<line x1="${X(ts)}" y1="0" x2="${X(ts)}" y2="${AH}"/><text class="day" x="${X(ts) + 6}" y="17">${esc(t('dayLabel', new Date(ts)))}</text>`;
    for (const ts of ticks) axis += `<text x="${X(ts) + 4}" y="37">${pad2(new Date(ts).getHours())}:00</text>`;
  } else {
    let lastMonth = -1;
    for (const ts of ticks) {
      const dt = new Date(ts);
      if (dt.getMonth() !== lastMonth) { axis += `<text class="day" x="${X(ts) + 4}" y="17">${esc(t('monthLabel', dt))}</text>`; lastMonth = dt.getMonth(); }
      axis += `<line x1="${X(ts)}" y1="24" x2="${X(ts)}" y2="${AH}"/><text x="${X(ts) + 4}" y="37">${esc(t('tickDay', dt))}</text>`;
    }
  }
  axis += `<line x1="${X(now)}" y1="${AH - 10}" x2="${X(now)}" y2="${AH}" style="stroke:var(--accent)" stroke-width="2"/>`;

  let b = '';
  for (const ts of ticks) b += `<line class="grid-l" x1="${X(ts)}" y1="0" x2="${X(ts)}" y2="${BH}"/>`;
  if (step < 24) for (const ts of days) b += `<line class="grid-day" x1="${X(ts)}" y1="0" x2="${X(ts)}" y2="${BH}"/>`;
  ids.forEach((id, i) => { b += `<line class="row-sep" x1="0" y1="${(i + 1) * RH - 0.5}" x2="${W}" y2="${(i + 1) * RH - 0.5}"/>`; });
  const rowY = new Map(ids.map((id, i) => [id, i * RH + RH / 2]));
  const selC = S.sel && S.sel.type === 'commit' ? S.sel.id : null;
  const mergeTs = new Map();
  for (const c of S.commits.values()) if (c.kind === 'merge' && c.mergeOf) mergeTs.set(c.mergeOf, Math.max(mergeTs.get(c.mergeOf) || 0, c.ts));
  for (const id of ids) {

// The clipboard API needs a secure page (https or localhost). A phone opens this one over plain http on the
// tailnet, so copying falls back to execCommand, and failing that shows the text selected, to copy by hand.
async function copyText(text, okMsg) {
  let ok = false;
  if (window.isSecureContext && navigator.clipboard) { try { await navigator.clipboard.writeText(text); ok = true; } catch {} }
  if (!ok) ok = copyLegacy(text);

  S.sheet = 'copy'; document.body.classList.add('sheet-open');
  setSheet(t('copy'), `<p>${esc(t('tCopyFail'))}</p><textarea class="import" readonly>${esc(text)}</textarea>`);

function copyLegacy(text) {

  document.body.appendChild(box);
  box.focus(); box.setSelectionRange(0, text.length);

}

    const existing = a.thread && S.threads.has(a.thread);
    const target = existing ? tName(a.thread) : String(a.newThread).trim();
    return item(`data-type="assign" data-commit="${esc(a.commit)}" ${existing ? `data-thread="${esc(a.thread)}"` : `data-new-thread="${esc(target)}"`}`,
      `“${esc(S.commits.get(a.commit).title.slice(0, 40))}” → <b>${esc(target)}</b>${existing ? '' : esc(t('aiNew'))}`, a.why);
  }).join('')}</div>`;
  if (rels.length) body += `<div class="sec-label">${esc(t('aiRelations'))}</div><div class="ai-list">${rels.map(r => {
    const label = String(r.label || t('edgeRelated')).slice(0, 24);
    return item(`data-type="rel" data-from="${esc(r.from)}" data-to="${esc(r.to)}" data-label="${esc(label)}"`,
      `<b>${esc(tName(r.from))}</b> —${esc(label)}→ <b>${esc(tName(r.to))}</b>`, r.why);
  }).join('')}</div>`;
  if (stale.length) body += `<div class="sec-label">${esc(t('aiStale'))}</div><div class="ai-list">${stale.map(s =>
    item(`data-type="stale" data-thread="${esc(s.thread)}"`, t('aiStaleItem', esc(tName(s.thread))), s.why)).join('')}</div>`;
  const any = assign.length || rels.length || stale.length;
  if (!any) body += `<p>${esc(t('aiNoChanges'))}</p>`;
  setSheet(t('aiTitle'), body, any ? `<button class="btn" id="ai-cancel">${esc(t('aiCancel'))}</button><button class="btn btn-primary" id="ai-apply">${esc(t('aiApply'))}</button>` : `<button class="btn" id="ai-cancel">${esc(t('aiClose'))}</button>`);
  $('#ai-cancel').onclick = closeSheet;
  const ap = $('#ai-apply'); if (ap) ap.onclick = applyAI;
}
function applyAI() {
  if (!canWrite()) return;
  const created = new Map();
  let n = 0;
  for (const box of $$('#sheet-body input[type=checkbox]:checked')) {
    const d = box.dataset;
    if (d.type === 'assign' && S.commits.has(d.commit)) {
      let tid = d.thread;
      if (!tid) { const name = d.newThread; if (!created.has(name)) created.set(name, ensureThread(name)); tid = created.get(name); }
      patchDoc('commits', d.commit, { thread: tid }, 0); n++;
    } else if (d.type === 'rel') { putDoc('edges', { id: uid('e'), from: d.from, to: d.to, label: d.label, createdAt: Date.now(), byAI: true }, 0); n++; }
    else if (d.type === 'stale') { patchDoc('threads', d.thread, { status: 'parked' }, 0); n++; }
  }
  closeSheet();
  toast(n ? t('tApplied', n) : t('tNoneChecked'));
}

/* ================= toast & boot ================= */
let toastT = 0;
function toast(msg, action) {
  const el = $('#toast');
  el.textContent = msg;
  if (action) { const b = document.createElement('button'); b.className = 'toast-act'; b.textContent = action.label; b.onclick = () => { el.hidden = true; action.run(); }; el.append(b); }
  el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, action ? 10000 : 2600);
}

applyStatic();
renderKinds();
autosize();
const h = (location.hash || '').slice(1);
setView(['git', 'timeline', 'agents'].includes(h) ? h : 'canvas');
initStore();
initSample();
})();
</script>
